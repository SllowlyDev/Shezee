<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR Berhasil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #0a0a0a;
            position: relative;
        }

        /* Animated Gradient Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e, #16213e);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            z-index: -2;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            max-width: 90vw;
            width: 500px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 60px rgba(100, 100, 255, 0.1),
                inset 0 0 20px rgba(255, 255, 255, 0.02);
            text-align: center;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: fadeInUp 1.2s ease-out 0.3s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Neon Glow Text */
        .success-text {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            text-shadow: 
                0 0 10px rgba(100, 200, 255, 0.8),
                0 0 20px rgba(100, 200, 255, 0.5),
                0 0 40px rgba(100, 200, 255, 0.3);
            opacity: 0;
            animation: textGlow 1.5s ease-out 0.8s forwards, pulseGlow 3s ease-in-out infinite 2s;
        }

        @keyframes textGlow {
            from {
                opacity: 0;
                letter-spacing: 10px;
            }
            to {
                opacity: 1;
                letter-spacing: 2px;
            }
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(100, 200, 255, 0.8), 0 0 20px rgba(100, 200, 255, 0.5); }
            50% { text-shadow: 0 0 20px rgba(100, 200, 255, 1), 0 0 40px rgba(100, 200, 255, 0.8), 0 0 60px rgba(100, 200, 255, 0.4); }
        }

        /* Checkmark Animation */
        .checkmark {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            position: relative;
            opacity: 0;
            animation: scaleIn 0.8s ease-out 1.5s forwards;
        }

        .checkmark svg {
            width: 100%;
            height: 100%;
        }

        .checkmark-circle {
            fill: none;
            stroke: #4ade80;
            stroke-width: 3;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            animation: strokeDraw 0.6s ease-out 1.8s forwards;
        }

        .checkmark-check {
            fill: none;
            stroke: #4ade80;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: strokeDraw 0.4s ease-out 2.2s forwards;
        }

        @keyframes strokeDraw {
            to { stroke-dashoffset: 0; }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Video Container */
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(100, 100, 255, 0.2);
            opacity: 0;
            animation: fadeIn 1s ease-out 1s forwards;
        }

        .video-container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff00cc, #3333ff, #00ccff, #ff00cc);
            background-size: 400% 400%;
            border-radius: 18px;
            z-index: -1;
            animation: borderGlow 3s ease infinite;
            opacity: 0.7;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .video-container video {
            width: 100%;
            display: block;
            border-radius: 16px;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Music Visualizer */
        .music-visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 40px;
            margin-top: 15px;
            opacity: 0;
            animation: fadeIn 1s ease-out 2.5s forwards;
        }

        .bar {
            width: 4px;
            background: linear-gradient(to top, #4ade80, #60a5fa);
            border-radius: 2px;
            animation: musicBar 1s ease-in-out infinite;
        }

        .bar:nth-child(1) { height: 20%; animation-delay: 0s; }
        .bar:nth-child(2) { height: 60%; animation-delay: 0.1s; }
        .bar:nth-child(3) { height: 40%; animation-delay: 0.2s; }
        .bar:nth-child(4) { height: 80%; animation-delay: 0.3s; }
        .bar:nth-child(5) { height: 30%; animation-delay: 0.4s; }
        .bar:nth-child(6) { height: 70%; animation-delay: 0.5s; }
        .bar:nth-child(7) { height: 50%; animation-delay: 0.6s; }
        .bar:nth-child(8) { height: 90%; animation-delay: 0.7s; }
        .bar:nth-child(9) { height: 35%; animation-delay: 0.8s; }
        .bar:nth-child(10) { height: 65%; animation-delay: 0.9s; }

        @keyframes musicBar {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.2); }
        }

        /* Status Text */
        .status-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-top: 10px;
            opacity: 0;
            animation: fadeIn 1s ease-out 3s forwards;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .glass-card {
                padding: 20px;
                width: 95vw;
            }
            .success-text {
                font-size: 1.5rem;
            }
            .checkmark {
                width: 60px;
                height: 60px;
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation"></div>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Content -->
    <div class="glass-card">
        <!-- Checkmark -->
        <div class="checkmark">
            <svg viewBox="0 0 52 52">
                <circle class="checkmark-circle" cx="26" cy="26" r="25"/>
                <path class="checkmark-check" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
        </div>

        <!-- Success Text -->
        <h1 class="success-text">Scan QR Berhasil</h1>

        <!-- Video Container -->
        <!-- ============================================================ -->
        <!-- CARA MENGGANTI VIDEO:                                         -->
        <!-- 1. Simpan file video (MP4) di folder yang sama dengan HTML    -->
        <!-- 2. Ubah src="video.mp4" menjadi nama file video kamu          -->
        <!--    Contoh: src="video-saya.mp4"                               -->
        <!-- ============================================================ -->
        <div class="video-container">
            <video autoplay muted loop playsinline poster="cover.jpg">
                <source src="video.mp4" type="video/mp4">
                Browser Anda tidak mendukung video tag.
            </video>
        </div>

        <!-- Music Visualizer -->
        <div class="music-visualizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- Status -->
        <p class="status-text">🎵 Musik sedang diputar...</p>
    </div>

    <!-- Background Music -->
    <!-- ============================================================ -->
    <!-- CARA MENGGANTI MUSIK:                                         -->
    <!-- 1. Simpan file musik (MP3) di folder yang sama dengan HTML    -->
    <!-- 2. Ubah src="musik.mp3" menjadi nama file musik kamu          -->
    <!--    Contoh: src="lagu-bernadya.mp3"                            -->
    <!-- ============================================================ -->
    <audio id="bgMusic" autoplay loop>
        <source src="musik.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung audio tag.
    </audio>

    <script>
        // Generate random particles
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                particle.style.animationDelay = (Math.random() * 20) + 's';
                particle.style.width = (Math.random() * 4 + 2) + 'px';
                particle.style.height = particle.style.width;
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                container.appendChild(particle);
            }
        }

        createParticles();

        // Handle autoplay restrictions
        document.addEventListener('DOMContentLoaded', function() {
            const music = document.getElementById('bgMusic');
            const video = document.querySelector('video');

            // Try to play music (may be blocked by browser autoplay policy)
            const playMusic = () => {
                music.play().catch(e => {
                    console.log('Autoplay blocked, waiting for user interaction...');
                });
            };

            playMusic();

            // Fallback: play on first user interaction if autoplay is blocked
            document.addEventListener('click', () => {
                if (music.paused) music.play();
                if (video.paused) video.play();
            }, { once: true });

            document.addEventListener('touchstart', () => {
                if (music.paused) music.play();
                if (video.paused) video.play();
            }, { once: true });
        });
    </script>
</body>
</html>
